syntax = "proto3";
import "common.proto";

package worker_api.v1;

service WorkerApi {
  rpc OpenClientConnection(stream ClientEvent) returns (stream ClientEvent);
  rpc OpenWorkerConnection(stream WorkerEvent) returns (stream WorkerEvent);
}

message Connect {
  string id = 1;
  common.v1.Addr addr = 2;
}

message ConnectResponse {
  string id = 1;
}

message Record {
  uint64 key = 1;
  bytes value = 2;
  uint64 ttl = 3;
}

message SyncBatchRequest {
  string id = 1;
  repeated Record records = 2;
}

message SyncBatchResponse {
  string sync_batch_request_id = 1;
  bool applied = 2;
}

message WorkerEvent {
  oneof payload {
    Connect connect = 1;
    ConnectResponse connect_response = 2;
    SyncBatchRequest sync_batch_request = 3;
    SyncBatchResponse sync_batch_response = 4;
  }
}

enum RequestType {
  Get = 0;
  Put = 1;
  Delete = 2;
}

message ClientRequest {
  int32 id = 1;
  RequestType request_type = 2;
  uint64 key = 3;
  optional bytes value = 4;
  optional uint64 ttl = 5;
}

message WorkerResponse {
  int32 request_id = 1;
  optional bytes value = 2;
}

message ClientEvent {
  oneof payload {
    ClientRequest request = 1;
    WorkerResponse response = 2;
  }
}
